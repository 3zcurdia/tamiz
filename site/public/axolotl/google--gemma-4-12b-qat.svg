<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Scooter -->
  <rect x="60" y="140" width="80" height="15" rx="5" fill="#333" />
  <circle cx="70" cy="155" r="15" fill="#555" />
  <circle cx="140" cy="155" r="15" fill="#555" />
  <rect x="110" y="120" width="10" height="30" fill="#777" />
  <rect x="120" y="110" width="5" height="40" fill="#777" />
  <path d="M125 110 L140 130 L130 135 Z" fill="#777" />
  
  <!-- Axolotl Body -->
  <ellipse cx="90" cy="100" rx="40" ry="30" fill="#a855f7" />
  <ellipse cx="110" cy="90" rx="35" ry="25" fill="#a855f7" />
  
  <!-- Axolotl Head -->
  <circle cx="135" cy="85" r="25" fill="#a855f7" />
  <circle cx="145" cy="80" r="5" fill="black" /> <!-- Eye -->
  <path d="M130 85 Q120 70 115 85" fill="#a855f7" stroke="#a855f7" stroke-width="2" /> <!-- Gills -->
  <path d="M140 85 Q150 70 145 85" fill="#a855f7" stroke="#a855f7" stroke-width="2" /> <!-- Gills -->
  <path d="M155 85 Q170 80 165 95" fill="#a855f7" /> <!-- Snout -->
  
  <!-- Axolotl Tail -->
  <path d="M60 110 Q30 110 20 140 Q40 150 60 130 Z" fill="#a855f7" />
  
  <!-- Axolotl Arms/Legs -->
  <path d="M100 120 Q110 140 120 140" stroke="#a855f7" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M80 120 Q70 140 60 140" stroke="#a855f7" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Wheels -->
  <circle cx="70" cy="155" r="12" fill="none" stroke="#333" stroke-width="3" />
  <circle cx="140" cy="155" r="12" fill="none" stroke="#333" stroke-width="3" />
</svg>
