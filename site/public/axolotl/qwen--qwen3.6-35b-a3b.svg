<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0f8ff"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="360" rx="120" ry="10" fill="#d0d0d0" opacity="0.5"/>

  <!-- Scooter Back Wheel -->
  <circle cx="120" cy="320" r="35" fill="#333"/>
  <circle cx="120" cy="320" r="25" fill="#666"/>
  <circle cx="120" cy="320" r="5" fill="#999"/>

  <!-- Scooter Front Wheel -->
  <circle cx="280" cy="320" r="35" fill="#333"/>
  <circle cx="280" cy="320" r="25" fill="#666"/>
  <circle cx="280" cy="320" r="5" fill="#999"/>

  <!-- Scooter Deck -->
  <rect x="110" y="310" width="180" height="15" rx="5" fill="#ff6b6b"/>

  <!-- Scooter Stem -->
  <line x1="270" y1="310" x2="270" y2="200" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round"/>

  <!-- Handlebars -->
  <path d="M 250 200 Q 270 190 290 200" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="245" y="195" width="10" height="10" rx="2" fill="#333"/>
  <rect x="285" y="195" width="10" height="10" rx="2" fill="#333"/>

  <!-- Axolotl Body -->
  <ellipse cx="200" cy="240" rx="45" ry="55" fill="#ffb6c1"/>
  
  <!-- Axolotl Belly -->
  <ellipse cx="200" cy="250" rx="30" ry="40" fill="#ffe4e1"/>

  <!-- Axolotl Head -->
  <ellipse cx="200" cy="180" rx="50" ry="40" fill="#ffb6c1"/>

  <!-- Gills (Left) -->
  <path d="M 155 170 Q 120 150 110 160" stroke="#ff69b4" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 150 185 Q 110 185 105 195" stroke="#ff69b4" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 155 200 Q 120 220 115 210" stroke="#ff69b4" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Gills (Right) -->
  <path d="M 245 170 Q 280 150 290 160" stroke="#ff69b4" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 250 185 Q 290 185 295 195" stroke="#ff69b4" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 245 200 Q 280 220 285 210" stroke="#ff69b4" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="185" cy="175" r="5" fill="#000"/>
  <circle cx="215" cy="175" r="5" fill="#000"/>
  <circle cx="183" cy="173" r="2" fill="#fff"/>
  <circle cx="213" cy="173" r="2" fill="#fff"/>

  <!-- Mouth -->
  <path d="M 190 190 Q 200 195 210 190" stroke="#d87093" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Arms holding handlebars -->
  <path d="M 170 230 Q 150 220 250 200" stroke="#ffb6c1" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 230 230 Q 250 220 290 200" stroke="#ffb6c1" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Legs -->
  <path d="M 170 280 Q 150 310 160 320" stroke="#ffb6c1" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 230 280 Q 250 310 240 320" stroke="#ffb6c1" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="160" cy="320" rx="10" ry="5" fill="#ffb6c1"/>
  <ellipse cx="240" cy="320" rx="10" ry="5" fill="#ffb6c1"/>
</svg>
