  <path d="M150 130 Q120 110 100 105" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M148 140 Q115 125 95 125" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M148 150 Q118 145 100 150" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 160 Q125 165 108 175" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Left gill feathery details -->
  <path d="M115 112 L105 100" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 118 L98 108" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M105 128 L92 120" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 135 L88 130" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 148 L100 142" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 155 L95 152" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 165 L105 172" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 170 L100 178" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right gills -->
  <path d="M250 130 Q280 110 300 105" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M252 140 Q285 125 305 125" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M252 150 Q282 145 300 150" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  <path d="M250 160 Q275 165 292 175" fill="none" stroke="#e879a8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Right gill feathery details -->
  <path d="M285 112 L295 100" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M290 118 L302 108" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M295 128 L308 120" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M300 135 L312 130" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M288 148 L300 142" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M292 155 L305 152" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M285 165 L295 172" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M290 170 L300 178" stroke="#f0a0c0" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <ellipse cx="178" cy="150" rx="10" ry="12" fill="white"/>
  <ellipse cx="222" cy="150" rx="10" ry="12" fill="white"/>
  <ellipse cx="180" cy="152" rx="6" ry="7" fill="#1a1a2e"/>
  <ellipse cx="224" cy="152" rx="6" ry="7" fill="#1a1a2e"/>
  <circle cx="182" cy="149" r="2.5" fill="white"/>
  <circle cx="226" cy="149" r="2.5" fill="white"/>
  
  <!-- Eyebrows -->
  <path d="M168 138 Q178 132 188 138" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M212 138 Q222 132 232 138" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Blush -->
  <ellipse cx="162" cy="165" rx="10" ry="6" fill="#f0a0c0" opacity="0.6"/>
  <ellipse cx="238" cy="165" rx="10" ry="6" fill="#f0a0c0" opacity="0.6"/>
  
  <!-- Smile -->
  <path d="M188 168 Q200 180 212 168" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left arm reaching to handlebar -->
  <path d="M175 210 Q160 195 170 180 Q180 170 200 172" fill="none" stroke="#9333ea" stroke-width="12" stroke-linecap="round"/>
  <circle cx="200" cy="172" r="7" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  
  <!-- Right arm reaching to handlebar -->
  <path d="M215 210 Q230 195 220 180 Q210 170 190 172" fill="none" stroke="#9333ea" stroke-width="12" stroke-linecap="round"/>
  <circle cx="190" cy="172" r="7" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  
