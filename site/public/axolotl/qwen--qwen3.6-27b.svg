  <path d="M180 270 Q170 285 175 290" fill="none" stroke="#9333ea" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="175" cy="292" rx="10" ry="6" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  
  <!-- Right leg on deck -->
  <path d="M210 270 Q220 285 215 290" fill="none" stroke="#9333ea" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="215" cy="292" rx="10" ry="6" fill="#a855f7" stroke="#9333ea" stroke-width="1.5"/>
  
  <!-- Small sparkles -->
  <circle cx="80" cy="80" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="320" cy="90" r="2.5" fill="#c084fc" opacity="0.7"/>
  <circle cx="340" cy="200" r="2" fill="#c084fc" opacity="0.5"/>
  <circle cx="60" cy="200" r="2.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="100" cy="350" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="300" cy="350" r="2" fill="#c084fc" opacity="0.4"/>
</svg>
