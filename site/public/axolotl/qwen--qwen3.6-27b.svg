<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0e6ff" rx="20"/>
  
  <!-- Ground shadow -->
  <ellipse cx="200" cy="340" rx="120" ry="12" fill="#d4b8e8" opacity="0.5"/>
  
  <!-- Scooter back wheel -->
  <circle cx="130" cy="310" r="30" fill="#4a4a4a" stroke="#333" stroke-width="3"/>
  <circle cx="130" cy="310" r="20" fill="#666" stroke="#555" stroke-width="2"/>
  <circle cx="130" cy="310" r="6" fill="#888"/>
  
  <!-- Scooter front wheel -->
  <circle cx="290" cy="310" r="30" fill="#4a4a4a" stroke="#333" stroke-width="3"/>
  <circle cx="290" cy="310" r="20" fill="#666" stroke="#555" stroke-width="2"/>
  <circle cx="290" cy="310" r="6" fill="#888"/>
  
  <!-- Scooter deck -->
  <rect x="110" y="285" width="190" height="14" rx="7" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <rect x="115" y="287" width="180" height="4" rx="2" fill="#8b5cf6" opacity="0.5"/>
  
  <!-- Scooter stem -->
  <rect x="278" y="170" width="14" height="115" rx="5" fill="#6d28d9" stroke="#5b21b6" stroke-width="2"/>
  
  <!-- Handlebar -->
  <path d="M240 175 Q240 165 250 165 L310 165 Q320 165 320 175" fill="none" stroke="#6d28d9" stroke-width="10" stroke-linecap="round"/>
  <circle cx="245" cy="170" r="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="315" cy="170" r="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  
  <!-- Axolotl tail -->
  <path d="M140 240 Q100 230 80 250 Q70 260 85 265 Q100 270 130 260" fill="#9333ea" stroke="#7c3aed" stroke-width="2"/>
  <path d="M130 260 Q100 270 85 265 Q95 275 115 268 Q125 265 130 260" fill="#a855f7"/>
  
  <!-- Axolotl body -->
  <ellipse cx="195" cy="230" rx="45" ry="55" fill="#9333ea" stroke="#7c3aed" stroke-width="2"/>
  
  <!-- Belly -->
  <ellipse cx="200" cy="235" rx="28" ry="40" fill="#c084fc" opacity="0.6"/>
  
  <!-- Axolotl head -->
  <ellipse cx="200" cy="155" rx="55" ry="42" fill="#9333ea" stroke="#7c3aed" stroke-width="2"/>
  
