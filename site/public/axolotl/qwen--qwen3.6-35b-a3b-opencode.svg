<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f4ff" rx="20"/>

  <!-- Ground / Road -->
  <rect x="0" y="480" width="800" height="120" fill="#4a4a5a" rx="0"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#f0f4ff" stroke-width="4" stroke-dasharray="30,20"/>

  <!-- Clouds -->
  <ellipse cx="120" cy="80" rx="60" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="160" cy="70" rx="50" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="80" cy="75" rx="45" ry="22" fill="white" opacity="0.8"/>

  <ellipse cx="650" cy="100" rx="55" ry="28" fill="white" opacity="0.7"/>
  <ellipse cx="690" cy="90" rx="45" ry="22" fill="white" opacity="0.7"/>
  <ellipse cx="610" cy="95" rx="40" ry="20" fill="white" opacity="0.7"/>

  <!-- Scooter shadow -->
  <ellipse cx="400" cy="485" rx="140" ry="12" fill="#3a3a4a" opacity="0.3"/>

  <!-- === SCOOTER === -->
  <!-- Back wheel -->
  <circle cx="280" cy="460" r="45" fill="#2d2d3d" stroke="#1a1a2e" stroke-width="4"/>
  <circle cx="280" cy="460" r="30" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="280" cy="460" r="8" fill="#777" stroke="#555" stroke-width="2"/>
  <!-- Spokes back -->
  <line x1="280" y1="420" x2="280" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="280" y1="460" x2="280" y2="500" stroke="#666" stroke-width="1.5"/>
  <line x1="240" y1="460" x2="280" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="280" y1="460" x2="320" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="252" y1="432" x2="280" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="280" y1="460" x2="308" y2="488" stroke="#666" stroke-width="1.5"/>
  <line x1="308" y1="432" x2="280" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="280" y1="460" x2="252" y2="488" stroke="#666" stroke-width="1.5"/>

  <!-- Front wheel -->
  <circle cx="520" cy="460" r="45" fill="#2d2d3d" stroke="#1a1a2e" stroke-width="4"/>
  <circle cx="520" cy="460" r="30" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="520" cy="460" r="8" fill="#777" stroke="#555" stroke-width="2"/>
  <!-- Spokes front -->
  <line x1="520" y1="420" x2="520" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="520" y1="460" x2="520" y2="500" stroke="#666" stroke-width="1.5"/>
  <line x1="480" y1="460" x2="520" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="520" y1="460" x2="560" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="492" y1="432" x2="520" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="520" y1="460" x2="548" y2="488" stroke="#666" stroke-width="1.5"/>
  <line x1="548" y1="432" x2="520" y2="460" stroke="#666" stroke-width="1.5"/>
  <line x1="520" y1="460" x2="492" y2="488" stroke="#666" stroke-width="1.5"/>

  <!-- Scooter frame -->
  <path d="M280 460 L320 380 L420 370 L520 460" fill="none" stroke="#e74c3c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Floorboard -->
  <path d="M310 400 L430 395" fill="none" stroke="#c0392b" stroke-width="12" stroke-linecap="round"/>
  <!-- Front fork -->
  <line x1="520" y1="460" x2="510" y2="350" stroke="#e74c3c" stroke-width="8" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="510" y1="350" x2="510" y2="320" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="480" y1="315" x2="540" y2="315" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <line x1="475" y1="312" x2="485" y2="318" stroke="#e74c3c" stroke-width="10" stroke-linecap="round"/>
  <line x1="535" y1="312" x2="545" y2="318" stroke="#e74c3c" stroke-width="10" stroke-linecap="round"/>

  <!-- Seat -->
  <ellipse cx="370" cy="365" rx="35" ry="12" fill="#2c3e50"/>
  <ellipse cx="370" cy="362" rx="33" ry="10" fill="#34495e"/>

  <!-- Headlight -->
  <ellipse cx="525" cy="355" rx="8" ry="12" fill="#f39c12" opacity="0.9"/>
  <ellipse cx="525" cy="355" rx="5" ry="8" fill="#f1c40f"/>

  <!-- === AXOLOTL === -->
  <!-- Body -->
  <ellipse cx="370" cy="310" rx="45" ry="55" fill="#c39bd3"/>
  <ellipse cx="370" cy="310" rx="40" ry="50" fill="#d7bde2"/>

  <!-- Belly -->
  <ellipse cx="375" cy="325" rx="28" ry="35" fill="#f0d9f5"/>

  <!-- Left arm -->
  <path d="M335 310 L310 340 L300 330" fill="none" stroke="#d7bde2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm reaching to handlebar -->
  <path d="M405 305 L440 310 L480 315" fill="none" stroke="#d7bde2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head -->
  <ellipse cx="370" cy="250" rx="55" ry="45" fill="#d7bde2"/>
  <ellipse cx="370" cy="255" rx="50" ry="40" fill="#e8c9f0"/>

  <!-- === GILLS (3 pairs) -->
  <!-- Left gills -->
  <path d="M320 235 Q280 210 260 220" fill="none" stroke="#bb8fce" stroke-width="6" stroke-linecap="round"/>
  <path d="M315 250 Q270 245 250 260" fill="none" stroke="#bb8fce" stroke-width="6" stroke-linecap="round"/>
  <path d="M320 265 Q275 280 260 300" fill="none" stroke="#bb8fce" stroke-width="6" stroke-linecap="round"/>
  <!-- Right gills -->
  <path d="M420 235 Q460 210 480 220" fill="none" stroke="#bb8fce" stroke-width="6" stroke-linecap="round"/>
  <path d="M425 250 Q470 245 490 260" fill="none" stroke="#bb8fce" stroke-width="6" stroke-linecap="round"/>
  <path d="M420 265 Q465 280 480 300" fill="none" stroke="#bb8fce" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="348" cy="245" r="10" fill="white"/>
  <circle cx="392" cy="245" r="10" fill="white"/>
  <circle cx="350" cy="246" r="6" fill="#2c3e50"/>
  <circle cx="394" cy="246" r="6" fill="#2c3e50"/>
  <!-- Eye shine -->
  <circle cx="352" cy="243" r="2.5" fill="white"/>
  <circle cx="396" cy="243" r="2.5" fill="white"/>

  <!-- Smile -->
  <path d="M355 268 Q370 282 385 268" fill="none" stroke="#8e44ad" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="338" cy="265" rx="10" ry="6" fill="#f5a0c0" opacity="0.5"/>
  <ellipse cx="402" cy="265" rx="10" ry="6" fill="#f5a0c0" opacity="0.5"/>

  <!-- Legs -->
  <path d="M345 355 L330 390 L340 400" fill="none" stroke="#d7bde2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M395 355 L410 390 L400 400" fill="none" stroke="#d7bde2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tail -->
  <path d="M325 350 Q290 370 270 360 Q260 355 265 350" fill="none" stroke="#d7bde2" stroke-width="8" stroke-linecap="round"/>

  <!-- === SPEED LINES === -->
  <line x1="180" y1="400" x2="140" y2="400" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="160" y1="420" x2="110" y2="420" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="170" y1="440" x2="130" y2="440" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <line x1="560" y1="280" x2="600" y2="280" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="570" y1="300" x2="620" y2="300" stroke="#aaa" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- === TITLE === -->
  <rect x="200" y="540" width="400" height="45" fill="white" rx="22" opacity="0.85"/>
  <text x="400" y="569" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#8e44ad">qwen--qwen3.6-35b-a3b</text>
</svg>
