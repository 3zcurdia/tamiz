<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Scooter rear wheel -->
  <circle cx="95" cy="335" r="28" fill="#2D2D2D"/>
  <circle cx="95" cy="335" r="12" fill="#777"/>
  <circle cx="95" cy="335" r="5" fill="#AAA"/>
  <!-- Scooter front wheel -->
  <circle cx="315" cy="335" r="28" fill="#2D2D2D"/>
  <circle cx="315" cy="335" r="12" fill="#777"/>
  <circle cx="315" cy="335" r="5" fill="#AAA"/>
  <!-- Scooter deck -->
  <rect x="85" y="308" width="240" height="14" rx="7" fill="#4A4A4A"/>
  <!-- Scooter stem -->
  <rect x="310" y="175" width="10" height="140" rx="5" fill="#4A4A4A"/>
  <!-- Handlebar -->
  <rect x="275" y="168" width="80" height="10" rx="5" fill="#4A4A4A"/>
  <!-- Handlebar grips -->
  <rect x="268" y="165" width="18" height="16" rx="8" fill="#2D2D2D"/>
  <rect x="344" y="165" width="18" height="16" rx="8" fill="#2D2D2D"/>
  <!-- Axolotl tail -->
  <path d="M130 285 Q100 310 75 300 Q55 288 65 268 Q72 255 85 260" fill="none" stroke="#8E44AD" stroke-width="14" stroke-linecap="round"/>
