  <path d="M120 178 Q110 172 102 165" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M115 182 Q105 180 95 175" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Left gill 3 -->
  <path d="M148 205 Q120 215 100 212" stroke="#E8A0BF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M125 212 Q115 218 105 218" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M120 208 Q110 212 100 212" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right gill 1 -->
  <path d="M242 165 Q265 145 278 128" stroke="#E8A0BF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M260 150 Q268 142 272 132" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M265 155 Q275 150 282 142" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right gill 2 -->
  <path d="M247 185 Q275 178 295 168" stroke="#E8A0BF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M270 178 Q280 172 288 165" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M275 182 Q285 180 295 175" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Right gill 3 -->
  <path d="M242 205 Q270 215 290 212" stroke="#E8A0BF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M265 212 Q275 218 285 218" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M270 208 Q280 212 290 212" stroke="#E8A0BF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="175" cy="182" r="9" fill="#1A0A2E"/>
  <circle cx="215" cy="182" r="9" fill="#1A0A2E"/>
  <circle cx="178" cy="179" r="3.5" fill="white"/>
  <circle cx="218" cy="179" r="3.5" fill="white"/>
  <!-- Cheeks -->
  <ellipse cx="160" cy="200" rx="10" ry="6" fill="#D488B8" opacity="0.5"/>
  <ellipse cx="230" cy="200" rx="10" ry="6" fill="#D488B8" opacity="0.5"/>
  <!-- Smile -->
  <path d="M178 205 Q195 222 212 205" stroke="#1A0A2E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Front left paw on handlebar -->
  <ellipse cx="278" cy="172" rx="14" ry="10" fill="#8E44AD"/>
  <!-- Front right paw on handlebar -->
  <ellipse cx="348" cy="172" rx="14" ry="10" fill="#8E44AD"/>
  <!-- Arms connecting body to paws -->
  <path d="M230 240 Q255 210 278 175" stroke="#9B59B6" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M240 250 Q290 220 348 175" stroke="#9B59B6" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Back feet on deck -->
  <ellipse cx="160" cy="305" rx="16" ry="9" fill="#8E44AD"/>
  <ellipse cx="220" cy="305" rx="16" ry="9" fill="#8E44AD"/>
